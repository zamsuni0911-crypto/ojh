<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DWG · DXF 도면 뷰어</title>
    <link rel="stylesheet" href="/src/styles/app.css" />
    <style>
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div class="viewer-container" id="viewerPane">
      <div class="upload-screen" id="uploadScreen">
        <div class="file-upload-container">
          <div class="upload-panel">
            <div class="upload-main">
              <section class="upload-hero">
                <div class="upload-icon" aria-hidden="true">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M11 16V7.85l-2.6 2.6L7 9.05 12 4l5 5.05-1.4 1.4L13 7.85V16h-2zm-5 4q-.825 0-1.412-.587T4 18V6q0-.825.588-1.412T6 4h12q.825 0 1.413.588T20 6v12q0 .825-.587 1.413T18 22H6z"/>
                  </svg>
                </div>
                <div class="upload-hero-text">
                  <h1 class="upload-title">도면 파일 열기</h1>
                  <p class="upload-subtitle">캐드 프로그램 없이 DWG · DXF 도면 바로 열기</p>
                </div>
              </section>

              <p class="offline-note">
                <span aria-hidden="true">🔒</span> 완전 오프라인 — 인터넷 연결 없이 이 PC 안에서만 도면을 엽니다. 파일은 외부로 전송되지 않습니다.
              </p>

              <div class="upload-actions">
                <button type="button" class="new-drawing-button" id="newDrawingButton" hidden>
                  새 도면
                </button>

                <div class="upload-dropzone" id="uploadDropzone" role="button" tabindex="0">
                  <div class="dropzone-content">
                    <p class="dropzone-title">
                      파일을 끌어다 놓거나 <span class="dropzone-link">찾아보기</span>
                    </p>
                    <div class="format-tags">
                      <span class="format-tag">DWG</span>
                      <span class="format-tag">DXF</span>
                      <span class="format-tag">DWT</span>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <section class="settings-section">
              <header class="settings-header">
                <h2 class="settings-title">열기 옵션</h2>
              </header>

              <div class="settings-grid">
                <div class="setting-block setting-block--full">
                  <h3 class="setting-label">초기 화면</h3>
                  <div class="pill-segment" data-option-group="openViewMode" role="radiogroup" aria-label="초기 화면">
                    <button type="button" class="pill-option is-active" data-value="auto" role="radio" aria-checked="true" title="도면에 맞춰 자동">자동</button>
                    <button type="button" class="pill-option" data-value="extents" role="radio" aria-checked="false" title="도면 전체 맞춤">전체 보기</button>
                    <button type="button" class="pill-option" data-value="saved" role="radio" aria-checked="false" title="AutoCAD 저장된 뷰">저장된 뷰</button>
                  </div>
                </div>

                <div class="setting-block setting-block--full">
                  <h3 class="setting-label">접근 모드</h3>
                  <div class="pill-segment" data-option-group="accessMode" role="radiogroup" aria-label="접근 모드">
                    <button type="button" class="pill-option" data-value="0" role="radio" aria-checked="false" title="보기 전용 (가장 빠름)">보기</button>
                    <button type="button" class="pill-option" data-value="4" role="radio" aria-checked="false" title="보기 및 검토">검토</button>
                    <button type="button" class="pill-option is-active" data-value="8" role="radio" aria-checked="true" title="전체 기능 (기본값)">편집</button>
                  </div>
                </div>

                <div class="setting-block">
                  <h3 class="setting-label">점진적 표시</h3>
                  <div class="pill-segment" data-option-group="progressiveRendering" role="radiogroup" aria-label="점진적 표시">
                    <button type="button" class="pill-option" data-value="true" role="radio" aria-checked="false" title="로딩 중에도 미리 표시">켜기</button>
                    <button type="button" class="pill-option is-active" data-value="false" role="radio" aria-checked="true" title="변환 완료 후 표시">끄기</button>
                  </div>
                </div>

                <div class="setting-block">
                  <h3 class="setting-label">비출력 레이어</h3>
                  <div class="pill-segment" data-option-group="noPlotLayers" role="radiogroup" aria-label="비출력 레이어">
                    <button type="button" class="pill-option is-active" data-value="false" role="radio" aria-checked="true" title="웹 뷰어 기본값">숨김</button>
                    <button type="button" class="pill-option" data-value="true" role="radio" aria-checked="false" title="AutoCAD 편집기 방식">표시</button>
                  </div>
                </div>

                <div class="setting-block" hidden>
                  <h3 class="setting-label">텍스트 렌더링</h3>
                  <div class="pill-segment" data-option-group="textRendering" role="radiogroup" aria-label="텍스트 렌더링">
                    <button type="button" class="pill-option is-active" data-value="worker" role="radio" aria-checked="true">워커</button>
                    <button type="button" class="pill-option" data-value="main" role="radio" aria-checked="false">메인 스레드</button>
                  </div>
                </div>
              </div>
            </section>
          </div>
        </div>

        <footer class="app-footer">
          프로그램 개선요청: 정보화담당관실(jhoh9505@unikorea.go.kr)
        </footer>
      </div>

      <button type="button" class="reopen-fab" id="reopenButton" aria-label="다른 파일 열기">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 6.5V15a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 17 15V7.5A1.5 1.5 0 0 0 15.5 6H7.414a1.5 1.5 0 0 1-1.06-.44l-1.414-1.414A1.5 1.5 0 0 0 4.586 4H4.5A1.5 1.5 0 0 0 3 5.5V6.5z"/>
          <path d="M8 11v2m0 0v-2m0 2h4m-4 0h4"/>
        </svg>
        열기
      </button>

      <section class="viewer-canvas-area" aria-label="도면 캔버스">
        <input type="file" id="fileInputElement" accept=".dxf,.dwg,.dwt" />
        <div id="cad-container"></div>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
